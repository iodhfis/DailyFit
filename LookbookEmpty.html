<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Fit · 룩북 · 빈 화면</title>
<style>
@font-face{font-family:Pretendard;font-weight:400;font-display:swap;src:url(assets/font/Pretendard-Regular.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:700;font-display:swap;src:url(assets/font/Pretendard-Bold.woff2) format("woff2")}
body{margin:0;background:#F7F5F1;color:#15171C}
a{color:#15171C}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}

*{scrollbar-width:none}
::-webkit-scrollbar{display:none;width:0;height:0}

html,body{height:100%;margin:0}
body{background:#E7E3DC !important;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif}
.stage{width:402px;height:874px;flex-shrink:0;transform-origin:center center}
.phone{width:402px;height:874px;border-radius:44px;overflow:hidden;box-shadow:0 24px 64px rgba(21,23,28,.18),0 0 0 8px #15171C;background:#F7F5F1;position:relative}
body.mobile .phone{border-radius:0;box-shadow:none}
body.mobile .gallery-link{display:none}
.gallery-link{position:fixed;left:24px;top:24px;height:40px;padding:0 16px;border-radius:20px;background:#FFFFFF;color:#15171C;font-size:14px;font-weight:700;text-decoration:none;display:flex;align-items:center;box-shadow:0 4px 16px rgba(21,23,28,.08)}
#demo-toast{position:absolute;left:20px;right:20px;bottom:104px;min-height:48px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#15171C;color:#FFFFFF;font-size:14px;font-weight:700;line-height:20px;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:50}
#demo-toast.show{opacity:1;transform:none}
#login-error{display:none;margin:-8px 0 0;font-size:12px;line-height:16px;color:#E5484D;font-weight:700}
#login-error.show{display:block}
.demo-hint{margin:-8px 0 0;font-size:12px;line-height:16px;color:#8A8D94;text-align:center}
.demo-hint b{color:#15171C}
</style>
</head>
<body data-page="LookbookEmpty">
<a class="gallery-link" href="screens.html">전체 화면 보기</a>
<div class="stage"><div class="phone">
<div style="width: 402px; height: 874px; box-sizing: border-box; background: #F7F5F1; position: relative; overflow: hidden; font-family: Pretendard, 'Apple SD Gothic Neo', sans-serif; color: #15171C">

  <div style="padding: 64px 20px 0 20px; display: flex; flex-direction: column; gap: 24px">

      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">

      <p style="margin: 0; font-size: 12px; font-weight: 400; line-height: 16px; color: #8A8D94">추천 결과에서 마음에 드는 룩을 저장해 보세요</p>
    </div>
    <a href="Main.html" style="height: 52px; padding: 0 16px; border-radius: 26px; border: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background: #15171C; color: #FFFFFF; width: 200px">추천 받으러 가기</a>
  </div>
  <nav aria-label="하단 탭" style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 64px; box-sizing: border-box; padding: 8px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(21,23,28,0.08); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #8A8D94; font-size: 12px; line-height: 12px; font-weight: 400"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A8D94" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg>홈</a>
    <a href="Result.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #8A8D94; font-size: 12px; line-height: 12px; font-weight: 400"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A8D94" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"></path></svg>추천</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #15171C; font-size: 12px; line-height: 12px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M9 3v18"></path></svg>룩북</a>
    <a href="My.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #8A8D94; font-size: 12px; line-height: 12px; font-weight: 400"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A8D94" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>마이</a>

</div></div>
