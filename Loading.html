.stage{width:402px;height:874px;flex-shrink:0;transform-origin:center center}

#demo-toast.show{opacity:1;transform:none}
#login-error{display:none;margin:-8px 0 0;font-size:12px;line-height:16px;color:#E5484D;font-weight:700}
#login-error.show{display:block}
.demo-hint{margin:-8px 0 0;font-size:12px;line-height:16px;color:#8A8D94;text-align:center}
