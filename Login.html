<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Fit · 회원가입</title>
<style>
@font-face{font-family:Pretendard;font-weight:400;font-display:swap;src:url(assets/font/Pretendard-Regular.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:700;font-display:swap;src:url(assets/font/Pretendard-Bold.woff2) format("woff2")}
body{margin:0;background:#F7F5F1;color:#15171C}
a{color:#15171C}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}

*{scrollbar-width:none}
::-webkit-scrollbar{display:none;width:0;height:0}

html,body{height:100%;margin:0}
body{background:#E7E3DC !important;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif}
.stage{width:402px;height:874px;flex-shrink:0;transform-origin:center center}
.phone{width:402px;height:874px;border-radius:44px;overflow:hidden;box-shadow:0 24px 64px rgba(21,23,28,.18),0 0 0 8px #15171C;background:#F7F5F1;position:relative}
body.mobile .phone{border-radius:0;box-shadow:none}
body.mobile .gallery-link{display:none}
.gallery-link{position:fixed;left:24px;top:24px;height:40px;padding:0 16px;border-radius:20px;background:#FFFFFF;color:#15171C;font-size:14px;font-weight:700;text-decoration:none;display:flex;align-items:center;box-shadow:0 4px 16px rgba(21,23,28,.08)}
#demo-toast{position:absolute;left:20px;right:20px;bottom:104px;min-height:48px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#15171C;color:#FFFFFF;font-size:14px;font-weight:700;line-height:20px;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:50}
#demo-toast.show{opacity:1;transform:none}
#login-error{display:none;margin:-8px 0 0;font-size:12px;line-height:16px;color:#E5484D;font-weight:700}
#login-error.show{display:block}
.demo-hint{margin:-8px 0 0;font-size:12px;line-height:16px;color:#8A8D94;text-align:center}
.demo-hint b{color:#15171C}
</style>
</head>
<body data-page="Login">
<a class="gallery-link" href="screens.html">전체 화면 보기</a>
<div class="stage"><div class="phone">
<div style="width: 402px; height: 874px; box-sizing: border-box; background: #F7F5F1; position: relative; overflow: hidden; font-family: Pretendard, 'Apple SD Gothic Neo', sans-serif; color: #15171C">

  <div style="padding: 64px 20px 0 20px; display: flex; flex-direction: column; gap: 24px">
    <div role="tablist" aria-label="계정" style="height: 44px; display: flex; align-items: center; gap: 24px">
      <a href="SignIn.html" role="tab" aria-selected="false" style="height: 36px; box-sizing: border-box; border-bottom: 2px solid transparent; font-size: 14px; font-weight: 400; line-height: 20px; color: #8A8D94; text-decoration: none; display: flex; align-items: center">로그인</a>
      <button role="tab" aria-selected="true" style="height: 36px; padding: 0; border: none; border-bottom: 2px solid #15171C; background: transparent; font-size: 14px; font-weight: 400; line-height: 20px; font-weight: 700; color: #15171C">회원가입</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 32px; letter-spacing: -0.4px">계정을 만들어요</h1>
      <p style="margin: 0; font-size: 12px; font-weight: 400; line-height: 16px; color: #8A8D94">3분 안에 첫 추천까지 도착해요</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="f-5063" style="font-size: 14px; font-weight: 400; line-height: 20px; font-weight: 700">이메일</label>
        <div style="position: relative">
          <input id="f-5063" type="email" placeholder="name@example.com" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 400; line-height: 20px; font-family: inherit; color: #15171C">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="f-8820" style="font-size: 14px; font-weight: 400; line-height: 20px; font-weight: 700">비밀번호</label>
        <div style="position: relative">
          <input id="f-8820" type="password" placeholder="8자 이상 입력" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 400; line-height: 20px; font-family: inherit; color: #15171C"><button aria-label="비밀번호 보기" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A8D94" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </div>
        <p style="margin: 0; font-size: 12px; font-weight: 400; line-height: 16px; color: #8A8D94">영문 · 숫자를 섞어 8자 이상</p>
      </div>
    </div>
    <a href="Consent.html" style="height: 52px; padding: 0 16px; border-radius: 26px; border: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background: #15171C; color: #FFFFFF">다음</a>
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="flex-grow: 1; height: 1px; background: #DAD4C9"></span><span style="font-size: 12px; font-weight: 400; line-height: 16px; color: #8A8D94">또는 간편하게</span><span style="flex-grow: 1; height: 1px; background: #DAD4C9"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="Consent.html" style="height: 52px; padding: 0 16px; border-radius: 26px; border: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background: #E7E3DC; color: #15171C">카카오로 계속하기</a>
      <a href="Consent.html" style="height: 52px; padding: 0 16px; border-radius: 26px; border: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background: #E7E3DC; color: #15171C">Apple로 계속하기</a>
      <a href="Consent.html" style="height: 52px; padding: 0 16px; border-radius: 26px; border: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background: #E7E3DC; color: #15171C">Google로 계속하기</a>
    </div>
  </div>
</div>
</div></div>
<script src="assets/app.js"></script>
</body>
</html>
