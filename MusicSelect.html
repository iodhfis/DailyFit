<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Fit · 음악 선택</title>
<style>
@font-face{font-family:Pretendard;font-weight:400;font-display:swap;src:url(assets/font/Pretendard-Regular.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:700;font-display:swap;src:url(assets/font/Pretendard-Bold.woff2) format("woff2")}
body{margin:0;background:#F7F5F1;color:#15171C}
a{color:#15171C}a:hover{color:#000000}
button{font-family:inherit;cursor:pointer}

*{scrollbar-width:none}
::-webkit-scrollbar{display:none;width:0;height:0}

html,body{height:100%;margin:0}
body{background:#E7E3DC !important;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif}
.stage{width:402px;height:874px;flex-shrink:0;transform-origin:center center}
.phone{width:402px;height:874px;border-radius:44px;overflow:hidden;box-shadow:0 24px 64px rgba(21,23,28,.18),0 0 0 8px #15171C;background:#F7F5F1;position:relative}
body.mobile .phone{border-radius:0;box-shadow:none}
body.mobile .gallery-link{display:none}
.gallery-link{position:fixed;left:24px;top:24px;height:40px;padding:0 16px;border-radius:20px;background:#FFFFFF;color:#15171C;font-size:14px;font-weight:700;text-decoration:none;display:flex;align-items:center;box-shadow:0 4px 16px rgba(21,23,28,.08)}
#demo-toast{position:absolute;left:20px;right:20px;bottom:104px;min-height:48px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#15171C;color:#FFFFFF;font-size:14px;font-weight:700;line-height:20px;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:50}
#demo-toast.show{opacity:1;transform:none}
#login-error{display:none;margin:-8px 0 0;font-size:12px;line-height:16px;color:#E5484D;font-weight:700}
#login-error.show{display:block}
.demo-hint{margin:-8px 0 0;font-size:12px;line-height:16px;color:#8A8D94;text-align:center}
.demo-hint b{color:#15171C}
</style>
</head>
<body data-page="MusicSelect">
<a class="gallery-link" href="screens.html">전체 화면 보기</a>
<div class="stage"><div class="phone">
<div style="width: 402px; height: 874px; box-sizing: border-box; background: #F7F5F1; position: relative; overflow: hidden; font-family: Pretendard, 'Apple SD Gothic Neo', sans-serif; color: #15171C">

  <div style="padding: 64px 20px 0 20px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="height: 44px; display: flex; align-items: center; gap: 8px">
        <a href="Main.html" aria-label="홈으로" style="width: 32px; height: 44px; border-radius: 22px; background: #F7F5F1; display: flex; align-items: center; justify-content: flex-start; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
        <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 32px; letter-spacing: -0.4px">음악 선택</h1>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 26px">오늘 듣는 음악은?</h2>
        <p style="margin: 0; font-size: 12px; font-weight: 400; line-height: 16px; color: #8A8D94">고른 장르에 맞춰 룩 분위기를 바꿔드려요</p>
      </div>
    </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">

          <button aria-pressed="false" style="height: 80px; box-sizing: border-box; padding: 16px 8px; border-radius: 16px; border: none; background: #FFFFFF; color: #15171C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 400; line-height: 20px; font-weight: 700; white-space: nowrap"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M12 11v10"></path><path d="M9 21h6"></path></svg>K-POP</button>
          <button aria-pressed="false" style="height: 80px; box-sizing: border-box; padding: 16px 8px; border-radius: 16px; border: none; background: #FFFFFF; color: #15171C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 400; line-height: 20px; font-weight: 700; white-space: nowrap"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>힙합/랩</button>
          <button aria-pressed="false" style="height: 80px; box-sizing: border-box; padding: 16px 8px; border-radius: 16px; border: none; background: #FFFFFF; color: #15171C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 400; line-height: 20px; font-weight: 700; white-space: nowrap"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4" height="7" rx="2"></rect><rect x="17" y="14" width="4" height="7" rx="2"></rect></svg>R&amp;B/소울</button>
          <button aria-pressed="true" style="height: 80px; box-sizing: border-box; padding: 16px 8px; border-radius: 16px; border: none; background: #15171C; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 400; line-height: 20px; font-weight: 700; white-space: nowrap"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5l-6 6"></path><path d="M17 3l4 4"></path><path d="M11 9a4 4 0 0 0-5.5 1.5c-1 .5-2.5 1-2.5 3 0 3 3 6 6 6 2 0 2.5-1.5 3-2.5A4 4 0 0 0 15 13z"></path><circle cx="9.5" cy="14.5" r="1.5"></circle></svg>인디 록</button>
          <button aria-pressed="false" style="height: 80px; box-sizing: border-box; padding: 16px 8px; border-radius: 16px; border: none; background: #FFFFFF; color: #15171C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 400; line-height: 20px; font-weight: 700; white-space: nowrap"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>메탈</button>
          <button aria-pressed="false" style="height: 80px; box-sizing: border-box; padding: 16px 8px; border-radius: 16px; border: none; background: #FFFFFF; color: #15171C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 400; line-height: 20px; font-weight: 700; white-space: nowrap"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>발라드</button>
          <button aria-pressed="false" style="height: 80px; box-sizing: border-box; padding: 16px 8px; border-radius: 16px; border: none; background: #FFFFFF; color: #15171C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 400; line-height: 20px; font-weight: 700; white-space: nowrap"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3"></circle></svg>재즈</button>
      </div>
    <div style="padding: 16px; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
      <span style="font-size: 14px; font-weight: 400; line-height: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5l-6 6"></path><path d="M17 3l4 4"></path><path d="M11 9a4 4 0 0 0-5.5 1.5c-1 .5-2.5 1-2.5 3 0 3 3 6 6 6 2 0 2.5-1.5 3-2.5A4 4 0 0 0 15 13z"></path><circle cx="9.5" cy="14.5" r="1.5"></circle></svg>인디 록</span>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 400; line-height: 16px; color: #8A8D94">이런 무드가 더해져요</span>
        <span style="display: flex; gap: 16px"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; line-height: 16px; color: #15171C"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F5B942; min-width: 8px; min-height: 8px; flex-shrink: 0; aspect-ratio: 1 / 1; display: inline-block"></span>빈티지</span><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; line-height: 16px; color: #15171C"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4C94FF; min-width: 8px; min-height: 8px; flex-shrink: 0; aspect-ratio: 1 / 1; display: inline-block"></span>스트릿</span></span>
      </div>
      <span style="font-size: 14px; font-weight: 400; line-height: 20px">데미지 포인트 데님, 체크 셔츠처럼 편안하고 거친 느낌</span>
    </div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px">
    <a href="MusicResult.html" style="height: 52px; padding: 0 16px; border-radius: 26px; border: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background: #15171C; color: #FFFFFF">이 무드로 추천 받기</a>

</div></div>

</html>
